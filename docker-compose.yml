services:
  backend:
    build: .
    env_file: .env
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/markets
    ports:
      - "3000:3000"
    depends_on:
      - backend
